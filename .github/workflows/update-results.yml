name: Update session results

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * 5,6,0'   # piątek-niedziela: co 10 minut (GitHub może opóźnić uruchomienie)

concurrency:
  group: update-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt

      - run: pip install -r data-pipeline/requirements.txt

      # Zakończone sezony z Jolpica się nie zmieniają: trzymamy je między przebiegami (limit API ~200 zapytań/h).
      - uses: actions/cache@v4
        with:
          path: .cache/jolpica
          key: jolpica-${{ github.run_id }}
          restore-keys: jolpica-

      - name: Fetch session results
        run: python data-pipeline/results.py --out public/data

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "Brak zmian w danych."
          else
            git commit -m "data: results $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
